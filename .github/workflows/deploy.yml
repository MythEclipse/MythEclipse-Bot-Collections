name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: booster-role-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # version comes from packageManager in package.json (pnpm@10.33.2)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:all

      - name: Test
        run: pnpm test

      - name: Build web verification app
        run: pnpm run web:build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: orangevps

    steps:
      # Checkout is required: the source tarball and the deploy script are both
      # shipped from THIS checkout, never from the payload live on the VPS.
      - uses: actions/checkout@v7

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key OK for ${VPS_HOST}"

      - name: Ship source + deploy script to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          # Exactly the tree the job above typechecked and tested.
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./.env' \
              -czf /tmp/booster-role-src.tgz .
          ls -lh /tmp/booster-role-src.tgz
          scp -o BatchMode=yes /tmp/booster-role-src.tgz \
              "$VPS_USER@$VPS_HOST:/tmp/booster-role-src.tgz"
          scp -o BatchMode=yes scripts/deploy-direct.sh \
              "$VPS_USER@$VPS_HOST:/tmp/booster-role-deploy.sh"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash /tmp/booster-role-deploy.sh '$DEPLOY_SHA' /tmp/booster-role-src.tgz"

      # Read-only confirmation for the CI log: the bot has no inbound listener,
      # so its health is systemd state + journal. dcbot-web does listen, so it
      # is probed through its own health endpoint — and the public domain is
      # checked separately below.
      - name: Verify services on VPS
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'systemctl is-active booster-role; systemctl show booster-role -p NRestarts --value; journalctl -u booster-role -n 20 --no-pager'
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'systemctl is-active dcbot-web; curl -fsS -m 5 http://127.0.0.1:4024/api/health; echo; journalctl -u dcbot-web -n 20 --no-pager'

      # The domain is the deliverable, so it is asserted from outside the box:
      # static landing page, a client-side route (proves the SPA fallback), and
      # the API through Caddy.
      - name: Verify the public site
        if: always()
        run: |
          set -eu
          curl -fsS -m 15 -o /dev/null -w 'landing %{http_code}\n' https://dcbot.asepharyana.my.id/
          curl -fsS -m 15 -o /dev/null -w 'dashboard %{http_code}\n' https://dcbot.asepharyana.my.id/dashboard
          curl -fsS -m 15 https://dcbot.asepharyana.my.id/api/public/bots | head -c 200; echo
