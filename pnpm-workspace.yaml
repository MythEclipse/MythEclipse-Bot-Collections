# Workspace packages are kept separate from the root bot package so the
# existing deployment entrypoint remains stable during migration.
packages:
  - apps/*
  - packages/*

# pnpm workspace for the deployed booster-role payload and verification web app.
#
# The root package remains the deployed bot while apps/* and packages/* are
# independently buildable workspace packages. This file also whitelists the
# lifecycle script pnpm blocks by default. esbuild (pulled in transitively by tsx and drizzle-kit)
# downloads a platform binary on install; without it, tsx cannot resolve the
# TypeScript transform and every entry point fails at startup.
#
# The allow-list is written twice on purpose: pnpm 10 reads
# `onlyBuiltDependencies`, pnpm 11+ reads `allowBuilds`. The VPS resolves pnpm
# 10.33.2 through the `packageManager` field while a bare `pnpm` outside the
# project is 12.6.0, so both spellings must be present or `pnpm install
# --frozen-lockfile` dies with ERR_PNPM_IGNORED_BUILDS. Verified locally:
# exit 1 on pnpm 12.6.0 with `onlyBuiltDependencies` alone, exit 0 with both.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# `minimumReleaseAge: 0` is DELIBERATE, and paired with
# `cooldown: default-days: 3` in .github/dependabot.yml.
#
# Dependabot resolves with its OWN bundled pnpm (11.x/12.x) and ignores this
# repo's `packageManager` pin — the same split the comment above describes from
# the other direction. Since pnpm 11 that bundled version defaults
# `minimumReleaseAge` to 1440 minutes, so a dependency released within the last
# day is refused with ERR_PNPM_NO_MATURE_MATCHING_VERSION and the update job
# dies. The cooldown keeps young versions from being PROPOSED; this stops the
# install FAILING if one slips past. Both are required.
minimumReleaseAge: 0
